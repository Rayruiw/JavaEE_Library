<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">

<h:head>
    <title>Manage Borrowers</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />

    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .card-shell {
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 0.6rem rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e5e5;
        }
        .card-shell .card-header {
            border-bottom: 1px solid #ececec;
            background-color: #fafafa;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        .table thead th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .table tbody tr:hover {
            background-color: #f5f7fb;
        }
    </style>
</h:head>


<h:body>
    <f:metadata>
        <f:event type="preRenderView"
                 listener="#{librarianBorrowerBean.ensureLoggedIn}"/>
    </f:metadata>
    <h:form id="borrowerForm">
        <div class="container">

            <!-- 顶部导航 -->
            <div class="d-flex justify-content-between align-items-center page-header">
                <div>
                    <h1 class="h2 mb-1">Manage Borrowers</h1>
                    <small class="text-muted">
                        View borrower accounts and basic information.
                    </small>
                </div>

                <div>
                    <h:link outcome="librarian-dashboard"
                            value="Back to Dashboard"
                            styleClass="btn btn-outline-secondary btn-sm" />
                </div>
            </div>

            <!-- 提示消息（可选） -->
            <h:panelGroup rendered="#{not empty facesContext.messageList}">
                <div class="alert alert-info mb-3">
                    <h:messages globalOnly="false" layout="list" />
                </div>
            </h:panelGroup>

            <!-- 借阅者列表 + 搜索 -->
            <div class="card-shell">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Borrower List</h5>

                    <!-- 搜索区域 -->
                    <div class="d-flex gap-2" style="max-width: 380px;">
                        <h:inputText value="#{librarianBorrowerBean.keyword}"
                                     styleClass="form-control form-control-sm"
                                     p:placeholder="Search by name or email" />
                        <h:commandButton value="Search"
                                         styleClass="btn btn-primary btn-sm"
                                         action="#{librarianBorrowerBean.search}" />
                        <h:commandButton value="Clear"
                                         styleClass="btn btn-outline-secondary btn-sm"
                                         action="#{librarianBorrowerBean.clearSearch}" />
                    </div>
                </div>

                <div class="card-body table-wrapper p-0">
                    <h:dataTable value="#{librarianBorrowerBean.borrowers}"
                                 var="b"
                                 styleClass="table table-striped table-hover mb-0 align-middle"
                                 headerClass="table-light">

                        <h:column>
                            <f:facet name="header">Name</f:facet>
                            <h:outputText value="#{b.firstName} #{b.lastName}" />
                        </h:column>

                        <h:column>
                            <f:facet name="header">Email</f:facet>
                            <h:outputText value="#{b.email}" />
                        </h:column>

                        <!-- 如果 Borrower 有 createdAt 字段，可以解开下面注释 -->
                        <!--
                        <h:column>
                            <f:facet name="header">Created At</f:facet>
                            <h:outputText value="#{b.createdAt}" />
                        </h:column>
                        -->
                    </h:dataTable>
                </div>
            </div>

        </div>
    </h:form>
</h:body>
</html>
