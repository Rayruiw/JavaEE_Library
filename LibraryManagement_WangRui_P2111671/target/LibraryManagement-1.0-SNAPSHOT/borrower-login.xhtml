<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">

<h:head>
    <title>Borrower Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 40px;
        }
        .card-shell {
            max-width: 420px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 0.6rem rgba(0,0,0,0.06);
            border: 1px solid #e5e5e5;
            padding: 2rem;
        }
        .page-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>

    <script type="text/javascript">
        function toggleLoginPassword() {
            var pwdInput = document.getElementById('loginForm:password');
            var icon = document.getElementById('pwdToggleIcon');
            if (!pwdInput || !icon) return;

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</h:head>

<h:body>
<h:form id="loginForm">
    <div class="container">
        <div class="card-shell">

            <div class="page-title">
                <h2 class="mb-1">Borrower Login</h2>
                <small class="text-muted">
                    Sign in to browse and borrow books.
                </small>
            </div>

            <!-- 消息：含注册成功图标 -->
            <h:panelGroup rendered="#{not empty facesContext.messageList}">
                          
                    <h:messages globalOnly="true"
                                layout="list"
                                styleClass="alert alert-danger"
                                rendered="#{not empty facesContext.messageList}" />
               
            </h:panelGroup>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <h:inputText id="email"
                             value="#{borrowerLoginBean.email}"
                             styleClass="form-control"
                             required="true"
                             requiredMessage="Email is required."
                             p:type="email" />
                <h:message for="email" styleClass="text-danger small" />
            </div>

            <!-- Password + 显示/隐藏按钮 -->
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <h:inputSecret id="password"
                                   value="#{borrowerLoginBean.password}"
                                   styleClass="form-control"
                                   required="true"
                                   requiredMessage="Password is required."
                                   redisplay="true" />
                    <button class="btn btn-outline-secondary"
                            type="button"
                            onclick="toggleLoginPassword()">
                        <i id="pwdToggleIcon" class="bi bi-eye"></i>
                    </button>
                </div>
                <h:message for="password" styleClass="text-danger small" />
            </div>

            <!-- 底部按钮 -->
            <div class="d-flex justify-content-between align-items-center">
                <!-- 去注册页 -->
                <h:link outcome="borrower-register"
                        value="Create account"
                        styleClass="btn btn-link p-0" />

                <!-- 登录 -->
                <h:commandButton value="Login"
                                 styleClass="btn btn-primary"
                                 action="#{borrowerLoginBean.login}" />
            </div>
            
            <div class="d-grid gap-2 mt-2">
                <h:link outcome="index" styleClass="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-left"></i>
                    Back to Home
                </h:link>
            </div>

        </div>
    </div>
</h:form>
</h:body>
</html>
