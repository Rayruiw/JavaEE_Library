<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="jakarta.faces.passthrough">

<h:head>
    <title>Manage Book Copies</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- Bootstrap Icons（如果你的其它页面已经引入，可以省略） -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 32px;
            padding-bottom: 32px;
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .card-shell {
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 0.25rem 0.6rem rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e5e5;
        }
        .card-shell .card-header {
            border-bottom: 1px solid #ececec;
            background-color: #fafafa;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        .table tbody tr:hover {
            background-color: #f5f7fb;
        }
    </style>
</h:head>


<f:metadata>
        <f:event type="preRenderView"
                 listener="#{librarianBookCopyBean.ensureLoggedIn}"/>
</f:metadata>

<h:body>
    <h:form id="copyForm">
        <div class="container">

            <!-- 顶部导航 -->
            <div class="d-flex justify-content-between align-items-center page-header">
                <div>
                    <h1 class="h2 mb-1">Manage Book Copies</h1>
                    <small class="text-muted">
                        View, create and edit physical book copies.
                    </small>
                </div>

                <div>
                    <h:link outcome="librarian-dashboard"
                            value="Back to Dashboard"
                            styleClass="btn btn-outline-secondary btn-sm" />
                </div>
            </div>

            <!-- 全局消息 -->
            <h:panelGroup rendered="#{not empty facesContext.messageList}">
                <div class="alert alert-info mb-3">
                    <h:messages globalOnly="false" layout="list" />
                </div>
            </h:panelGroup>

            <div class="row gy-4">
                <!-- 左：BookCopy 列表 -->
                <div class="col-12 col-lg-7">
                    <div class="card-shell">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="mb-0">Book Copy List</h5>

                                <h:commandButton value="New Copy"
                                                 styleClass="btn btn-primary btn-sm"
                                                 action="#{librarianBookCopyBean.startNew}" />
                            </div>

                            <!-- 搜索栏：按书名 -->
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>
                                <h:inputText value="#{librarianBookCopyBean.searchTitle}"
                                             styleClass="form-control"
                                             p:placeholder="Search by book title..." />
                                <h:commandButton value="Search"
                                                 styleClass="btn btn-outline-secondary"
                                                 action="#{librarianBookCopyBean.search}" />
                            </div>
                            <div class="mt-1 text-end">
                                <h:commandLink value="Clear search"
                                               styleClass="small"
                                               action="#{librarianBookCopyBean.clearSearch}" />
                            </div>
                        </div>

                        <div class="card-body table-wrapper p-0">
                            <h:dataTable value="#{librarianBookCopyBean.copies}"
                                         var="c"
                                         styleClass="table table-striped table-hover mb-0 align-middle"
                                         headerClass="table-light">

                                <h:column>
                                    <f:facet name="header">Copy ID</f:facet>
                                    <h:outputText value="#{c.id}" />
                                </h:column>

                                <h:column>
                                    <f:facet name="header">Book Title</f:facet>
                                    <h:outputText value="#{c.book.title}" />
                                </h:column>

                                <h:column>
                                    <f:facet name="header">Status</f:facet>
                                    <span class="badge bg-secondary">
                                        <h:outputText value="#{c.status.name}" />
                                    </span>
                                </h:column>

                                <h:column>
                                    <f:facet name="header">Actions</f:facet>

                                    <!-- 如果状态是 BORROWED 或 PENDING：按钮禁用 -->
                                    <h:panelGroup rendered="#{c.status.code eq 'BORROWED' or c.status.code eq 'PENDING'}">
                                        <button class="btn btn-sm btn-outline-secondary me-1"
                                                disabled="disabled"
                                                title="This copy is currently not editable.">
                                            Edit
                                        </button>
                                    </h:panelGroup>

                                    <!-- 其它状态：正常可编辑 -->
                                    <h:panelGroup rendered="#{not (c.status.code eq 'BORROWED' or c.status.code eq 'PENDING')}">
                                        <h:commandButton value="Edit"
                                                         styleClass="btn btn-sm btn-outline-primary me-1"
                                                         action="#{librarianBookCopyBean.startEdit(c)}" />
                                    </h:panelGroup>

                                </h:column>

                            </h:dataTable>
                        </div>
                    </div>
                </div>

                <!-- 右：表单 -->
                <div class="col-12 col-lg-5">
                    <h:panelGroup rendered="#{librarianBookCopyBean.showForm}">
                        <div class="card-shell p-4">
                            <h5 class="mb-3">
                                <h:outputText
                                        value="#{librarianBookCopyBean.editingCopy != null
                                                 and librarianBookCopyBean.editingCopy.id != null
                                                 ? 'Edit Book Copy'
                                                 : 'Create New Book Copy'}" />
                            </h5>

                            <!-- 选择 Book -->
                            <div class="mb-3">
                                <label class="form-label">Book</label>
                                <h:selectOneMenu value="#{librarianBookCopyBean.selectedBookId}"
                                                 styleClass="form-select">
                                    <f:selectItem itemValue="#{null}"
                                                  itemLabel="-- Select Book --"
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{librarianBookCopyBean.books}"
                                                   var="b"
                                                   itemValue="#{b.id}"
                                                   itemLabel="#{b.title}" />
                                </h:selectOneMenu>
                            </div>

                            <!-- 选择 Status -->
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <h:selectOneMenu value="#{librarianBookCopyBean.selectedStatusId}"
                                                 styleClass="form-select">
                                    <f:selectItem itemValue="#{null}"
                                                  itemLabel="-- Select Status --"
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{librarianBookCopyBean.statuses}"
                                                   var="s"
                                                   itemValue="#{s.id}"
                                                   itemLabel="#{s.name}" />
                                </h:selectOneMenu>
                            </div>

                            <div class="d-flex justify-content-end">
                                <h:commandButton value="Save"
                                                 styleClass="btn btn-primary me-2"
                                                 action="#{librarianBookCopyBean.saveCopy}" />
                                <h:commandButton value="Cancel"
                                                 styleClass="btn btn-outline-secondary"
                                                 action="#{librarianBookCopyBean.resetForm}" />
                            </div>
                        </div>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not librarianBookCopyBean.showForm}">
                        <div class="card-shell p-4 text-center text-muted">
                            Click <strong>New Copy</strong> or <strong>Edit</strong> to manage book copies.
                        </div>
                    </h:panelGroup>
                </div>
            </div>

        </div>
    </h:form>
</h:body>
</html>
