<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="jakarta.faces.passthrough">

<h:head>
    <title>Librarian Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <!-- ✅ 加上这一行：Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        body {
            background-color: #f5f5f5;
        }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
        }
    </style>
</h:head>

<h:body>
<h:form>

    <div class="card login-card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-3 text-center">Librarian Sign In</h3>

            <!-- 消息提示 -->
            <h:messages globalOnly="true"
                        rendered="#{not empty facesContext.messageList}"
                        styleClass="alert alert-danger"
                        layout="list" />

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <h:inputText id="email"
                             value="#{librarianLoginBean.email}"
                             styleClass="form-control"
                             p:placeholder="admin@example.com"
                             required="true"
                             requiredMessage="Email is required"/>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <h:inputSecret id="password"
                               value="#{librarianLoginBean.password}"
                               styleClass="form-control"
                               p:placeholder="Enter your password"
                               required="true"
                               requiredMessage="Password is required"/>
            </div>

            <!-- Login button -->
            <div class="d-grid gap-2">
                <h:commandButton value="Sign In"
                                 styleClass="btn btn-primary"
                                 action="#{librarianLoginBean.login}" />
            </div>
            
            <div class="d-grid gap-2 mt-2">
                <h:link outcome="index" styleClass="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-left"></i>
                    Back to Home
                </h:link>
            </div>
        </div>
    </div>

</h:form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
