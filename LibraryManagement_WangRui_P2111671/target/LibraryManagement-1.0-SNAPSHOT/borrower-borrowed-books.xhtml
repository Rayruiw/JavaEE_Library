<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>My Borrowed Books</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <style>
        body {
            padding-top: 40px;
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .messages ul {
            margin: 0;
            padding-left: 1.25rem;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:event type="preRenderView"
                 listener="#{borrowerBorrowedBean.ensureLoggedIn}" />
    </f:metadata>
    <div class="container">

        <h:form>

            <!-- 顶部：欢迎 + 导航 -->
            <div class="d-flex justify-content-between align-items-center page-header">
                <div>
                    <h2 class="mb-0">
                        Hello,
                        <h:outputText value="#{borrowerBorrowedBean.currentBorrower.firstName}" />
                        !
                    </h2>
                    <small class="text-muted">View and manage your borrowed books.</small>
                </div>

                <div class="btn-group">
                    <!-- 回到可借书列表 -->
                    <h:link outcome="borrower-available-books"
                            value="Available Books"
                            styleClass="btn btn-outline-secondary btn-sm" />
                    
                    <!-- 仍然复用 BorrowerHomeBean 里的 logout 方法 -->
                    <h:commandButton value="Logout"
                                     styleClass="btn btn-outline-danger btn-sm"
                                     action="#{borrowerHomeBean.logout}" />
                </div>
            </div>

            <!-- 全局消息 -->
            <h:messages globalOnly="true"
                        layout="list"
                        styleClass="alert alert-info messages"
                        rendered="#{not empty facesContext.messageList}" />

            <!-- 已借书列表 -->
            <h3>My Borrowed Books</h3>
            <h:dataTable value="#{borrowerBorrowedBean.borrowedBooks}"
                         var="r"
                         styleClass="table table-striped table-bordered align-middle"
                         headerClass="table-light fw-semibold">

                <h:column>
                    <f:facet name="header">Book</f:facet>
                    <h:outputText value="#{r.bookCopy.book.title}" />
                </h:column>

                <h:column>
                    <f:facet name="header">Borrow Date</f:facet>
                    <h:outputText value="#{r.borrowDate}" />
                </h:column>

                <h:column>
                    <f:facet name="header">Due Date</f:facet>
                    <h:outputText value="#{r.dueDate}" />
                </h:column>

                <h:column>
                    <f:facet name="header">Status / Action</f:facet>

                    <h:panelGroup layout="block">

                        <!-- 状态文字（原始状态码） -->
                        <div class="mb-1">
                            <h:outputText value="#{r.status}" />
                        </div>

                        <!-- 情况 1：管理员已批准（BORROWED）且未逾期 -> 显示“申请还书”按钮 -->
                        <h:commandButton value="Request Return"
                                         styleClass="btn btn-success btn-sm"
                                         action="#{borrowerBorrowedBean.returnBook(r.id)}"
                                         rendered="#{r.status eq 'BORROWED' and not r.overdue}" />

                        <!-- 情况 2：已经申请还书 -->
                        <h:outputText value="Return requested (waiting for librarian approval)"
                                      styleClass="text-muted"
                                      rendered="#{r.status eq 'RETURN_REQUESTED'}" />

                        <!-- 情况 3：借书还在申请中（管理员尚未批准） -->
                        <h:outputText value="Waiting for librarian approval"
                                      styleClass="text-muted"
                                      rendered="#{r.status eq 'REQUESTED_BORROW'}" />

                        <!-- 情况 4：已经逾期，但还没被系统判为 LOST -->
                        <h:outputText value="Overdue - please contact librarian"
                                      styleClass="text-danger"
                                      rendered="#{r.status eq 'BORROWED' and r.overdue}" />

                        <!-- 情况 5：已正常归还 -->
                        <h:outputText value="Returned (completed)"
                                      styleClass="text-muted"
                                      rendered="#{r.status eq 'COMPLETED'}" />

                        <!-- 情况 6：记录未完成（损坏 / 丢失，押金不退） -->
                        <h:outputText value="Incomplete (unapproved,lost or damaged copy)"
                                      styleClass="text-danger"
                                      rendered="#{r.status eq 'INCOMPLETE'}" />

                    </h:panelGroup>
                </h:column>
            </h:dataTable>

        </h:form>
    </div>
</h:body>
</html>
