<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>My Profile</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        body {
            padding-top: 40px;
            background-color: #f5f5f5;
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .card-shell {
            max-width: 720px;
            margin: 0 auto;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
        <f:event type="preRenderView"
                 listener="#{borrowerProfileBean.ensureLoggedIn}" />
    </f:metadata>
    <div class="container">

        <h:form id="profileForm">

            <!-- 顶部标题 -->
            <div class="d-flex justify-content-between align-items-center page-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-1"></i>
                    <div>
                        <h2 class="mb-0">My Profile</h2>
                        <small class="text-muted">
                            View your information and update your password.
                        </small>
                    </div>
                </div>

                <div class="btn-group">
                    <h:link outcome="borrower-available-books"
                            value="Back to Books"
                            styleClass="btn btn-outline-secondary btn-sm" />
                </div>
            </div>

            <!-- 全局消息 -->
            <h:messages globalOnly="true"
                        layout="list"
                        styleClass="alert alert-info"
                        rendered="#{not empty facesContext.messageList}" />

            <div class="card card-shell mb-3">
                <div class="card-body">
                    <h5 class="card-title mb-3">Personal Information</h5>

                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted">First Name</div>
                        <div class="col-sm-8">
                            <h:outputText value="#{borrowerProfileBean.currentBorrower.firstName}" />
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted">Last Name</div>
                        <div class="col-sm-8">
                            <h:outputText value="#{borrowerProfileBean.currentBorrower.lastName}" />
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted">Date of Birth</div>
                        <div class="col-sm-8">
                            <h:outputText value="#{borrowerProfileBean.formattedDob}" />
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted">Gender</div>
                        <div class="col-sm-8">
                            <h:outputText value="#{borrowerProfileBean.currentBorrower.gender}" />
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-sm-4 text-muted">Email</div>
                        <div class="col-sm-8">
                            <h:outputText value="#{borrowerProfileBean.currentBorrower.email}" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- 修改密码 -->
            <div class="card card-shell">
                <div class="card-body">
                    <h5 class="card-title mb-3">Change Password</h5>

                    <div class="mb-3">
                        <label class="form-label" for="newPwd">New Password</label>
                        <h:inputSecret id="newPwd"
                                       value="#{borrowerProfileBean.newPassword}"
                                       styleClass="form-control"
                                       required="true"
                                       requiredMessage="New password is required."
                                       redisplay="true" />
                        <small class="text-muted">
                            Password must be at least 8 characters and contain upper/lowercase letters, numbers and special characters.
                        </small>
                        <h:message for="newPwd" styleClass="text-danger small d-block mt-1" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirmPwd">Confirm New Password</label>
                        <h:inputSecret id="confirmPwd"
                                       value="#{borrowerProfileBean.confirmPassword}"
                                       styleClass="form-control"
                                       required="true"
                                       requiredMessage="Please confirm your new password."
                                       redisplay="true" />
                        <h:message for="confirmPwd" styleClass="text-danger small d-block mt-1" />
                    </div>

                    <div class="d-flex justify-content-end">
                        <h:commandButton value="Update Password"
                                         styleClass="btn btn-primary"
                                         action="#{borrowerProfileBean.changePassword}" />
                    </div>
                </div>
            </div>

        </h:form>
    </div>
</h:body>
</html>
