<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="jakarta.faces.passthrough"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>System Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />
</h:head>

<f:metadata>
    <f:event type="preRenderView"
             listener="#{systemAdminLoginBean.ensureLoggedIn}" />
</f:metadata>
<h:body>
<div class="container mt-4">

    <h:form>

        <!-- 顶部：标题 + 退出 -->
        <div class="d-flex justify-content-between mb-3">
            <h3>System Admin Panel</h3>
            <h:commandButton value="Logout"
                             styleClass="btn btn-outline-danger"
                             action="#{systemAdminLoginBean.logout}" />
        </div>

        <!-- 全局消息 -->
        <h:messages layout="list"
                    styleClass="alert alert-info"
                    rendered="#{not empty facesContext.messageList}" />

        <!-- Librarians list -->
        <h4>All Librarians</h4>
        <h:dataTable value="#{systemAdminManageLibrariansBean.librarians}"
                     var="l"
                     styleClass="table table-bordered table-striped align-middle">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{l.id}
            </h:column>

            <h:column>
                <f:facet name="header">Name</f:facet>
                #{l.firstName} #{l.lastName}
            </h:column>

            <h:column>
                <f:facet name="header">Email</f:facet>
                #{l.email}
            </h:column>

            <h:column>
                <f:facet name="header">Action</f:facet>
                <h:commandButton value="Delete"
                                 styleClass="btn btn-sm btn-outline-danger"
                                 action="#{systemAdminManageLibrariansBean.deleteLibrarian(l.id)}" />
            </h:column>
        </h:dataTable>

        <hr/>

        <!-- Create new librarian -->
        <h4>Create New Librarian</h4>
        <div class="row g-3 mb-3">

            <div class="col-md-3">
                <h:inputText value="#{systemAdminManageLibrariansBean.firstName}"
                             styleClass="form-control"
                             p:placeholder="First name" />
            </div>

            <div class="col-md-3">
                <h:inputText value="#{systemAdminManageLibrariansBean.lastName}"
                             styleClass="form-control"
                             p:placeholder="Last name" />
            </div>

            <div class="col-md-3">
                <h:inputText value="#{systemAdminManageLibrariansBean.email}"
                             styleClass="form-control"
                             p:placeholder="Email" />
            </div>

            <div class="col-md-3">
                <h:inputSecret value="#{systemAdminManageLibrariansBean.password}"
                               styleClass="form-control"
                               p:placeholder="Password"
                               redisplay="true" />
            </div>
        </div>

        <div class="mb-3">
            <h:commandButton value="Create Librarian"
                             styleClass="btn btn-primary"
                             action="#{systemAdminManageLibrariansBean.createLibrarian}" />
        </div>

    </h:form>
</div>
</h:body>
</html>
