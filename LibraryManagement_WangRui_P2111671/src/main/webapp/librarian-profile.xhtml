<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Librarian Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        body {
            padding-top: 40px;
            background-color: #f5f5f5;
        }
        .card-shell {
            max-width: 720px;
            margin: 0 auto;
        }
    </style>
</h:head>

<h:body>
    <f:metadata>
            <f:event type="preRenderView"
                     listener="#{librarianProfileBean.ensureLoggedIn}" />
    </f:metadata>
    <div class="container">
        <h:form id="profileForm">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-1"></i>
                    <div>
                        <h2 class="mb-0">Librarian Profile</h2>
                        <small class="text-muted">View your details or change your password.</small>
                    </div>
                </div>

                <h:link value="Dashboard"
                        outcome="librarian-dashboard"
                        styleClass="btn btn-outline-secondary btn-sm"/>
            </div>

            <h:messages globalOnly="true"
                        layout="list"
                        styleClass="alert alert-info"
                        rendered="#{not empty facesContext.messageList}" />

            <!-- Personal Info -->
            <div class="card card-shell mb-3">
                <div class="card-body">

                    <h5 class="card-title">Profile Information</h5>

                    <div class="mb-2">
                        <strong>Name:</strong>
                        #{librarianProfileBean.currentLibrarian.firstName}
                        #{librarianProfileBean.currentLibrarian.lastName}
                    </div>

                    <div class="mb-2">
                        <strong>Email:</strong>
                        #{librarianProfileBean.currentLibrarian.email}
                    </div>

                </div>
            </div>

            <!-- Change Password -->
            <div class="card card-shell">
                <div class="card-body">

                    <h5 class="card-title">Change Password</h5>

                    <div class="mb-3">
                        <label>New Password</label>
                        <h:inputSecret id="newPwd"
                                       value="#{librarianProfileBean.newPassword}"
                                       required="true"
                                       requiredMessage="New password is required."
                                       styleClass="form-control"
                                       redisplay="true" />
                        <h:message for="newPwd" styleClass="text-danger small"/>
                    </div>

                    <div class="mb-3">
                        <label>Confirm Password</label>
                        <h:inputSecret id="confirmPwd"
                                       value="#{librarianProfileBean.confirmPassword}"
                                       required="true"
                                       requiredMessage="Please confirm password."
                                       styleClass="form-control"
                                       redisplay="true" />
                        <h:message for="confirmPwd" styleClass="text-danger small"/>
                    </div>

                    <h:commandButton value="Update Password"
                                     styleClass="btn btn-primary"
                                     action="#{librarianProfileBean.changePassword}" />

                </div>
            </div>

        </h:form>
    </div>
</h:body>
</html>
