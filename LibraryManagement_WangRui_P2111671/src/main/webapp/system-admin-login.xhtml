<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>System Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 60px;
        }
        .login-card {
            max-width: 420px;
            margin: auto;
            padding: 2rem;
            background: white;
            border-radius: .75rem;
            box-shadow: 0 0.25rem 0.6rem rgba(0,0,0,0.1);
        }
        .page-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</h:head>

<h:body>
<div class="container">

    <h:form id="adminLoginForm">

        <!-- 登录框 -->
        <div class="login-card">

            <!-- 标题 -->
            <div class="page-title">
                <i class="bi bi-gear" style="font-size:2.4rem;"></i>
                <h2 class="mt-2 mb-1">System Admin Login</h2>
                <small class="text-muted">Restricted Access</small>
            </div>

            <!-- 全局消息 -->
            <h:messages globalOnly="true"
                        layout="list"
                        styleClass="alert alert-danger"
                        rendered="#{not empty facesContext.messageList}" />

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <h:inputText id="email"
                             styleClass="form-control"
                             value="#{systemAdminLoginBean.email}"
                             required="true"
                             requiredMessage="Email is required." />
                <h:message for="email" styleClass="text-danger small"/>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <h:inputSecret id="password"
                               styleClass="form-control"
                               value="#{systemAdminLoginBean.password}"
                               required="true"
                               requiredMessage="Password is required."
                               redisplay="true" />
                <h:message for="password" styleClass="text-danger small"/>
            </div>

            <!-- 按钮 -->
            <div class="d-flex justify-content-between">
                <h:link outcome="index"
                        value="Back to Home"
                        styleClass="btn btn-outline-secondary"/>

                <h:commandButton value="Login"
                                 styleClass="btn btn-primary"
                                 action="#{systemAdminLoginBean.login}" />
            </div>

        </div>

    </h:form>

</div>
</h:body>
</html>
